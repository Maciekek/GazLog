# Run the prebuilt image from GHCR instead of building locally:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d   # update
services:
  gazlog:
    image: ghcr.io/maciekek/gazlog:latest
    container_name: gazlog
    restart: unless-stopped
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - gazlog-data:/data

volumes:
  gazlog-data:
