# Production: prebuilt image from GHCR + Caddy reverse proxy with automatic HTTPS.
# No source code or build step needed on the server. See deploy/README.md.
services:
  gazlog:
    image: ghcr.io/maciekek/gazlog:${GAZLOG_TAG:-latest}
    container_name: gazlog
    restart: unless-stopped
    env_file: .env
    environment:
      BASE_URL: https://${DOMAIN}
    expose:
      - "3001"
    volumes:
      - gazlog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/auth/me').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: gazlog-caddy
    restart: unless-stopped
    depends_on:
      - gazlog
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gazlog-data:
  caddy-data:
  caddy-config:
