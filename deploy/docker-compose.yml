# Production: prebuilt image from GHCR. No source code or build step needed on the server.
# TLS and routing are done by the shared vps-proxy stack (Caddy reading these labels).
# See deploy/README.md.
services:
  gazlog:
    image: ghcr.io/maciekek/gazlog:${GAZLOG_TAG:-latest}
    container_name: gazlog
    restart: unless-stopped
    env_file: .env
    environment:
      BASE_URL: https://${DOMAIN}
    networks:
      - web
    labels:
      caddy: ${DOMAIN}
      caddy.import: secure
      caddy.reverse_proxy: "{{upstreams 3001}}"
      caddy.header.X-Frame-Options: DENY
      caddy_1: www.${DOMAIN}
      caddy_1.redir: https://${DOMAIN}{uri} permanent
    volumes:
      - gazlog-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/auth/me').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gazlog-data:

# Created by the vps-proxy stack
networks:
  web:
    external: true
